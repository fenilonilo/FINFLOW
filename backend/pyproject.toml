[project]
name = "finflow-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "drf-spectacular>=0.27",
  "django-filter>=24.0",
  "psycopg[binary]>=3.1",
  "python-dateutil>=2.9",
  "django-cors-headers>=4.3",
  "mcp<2",
  "pypdf>=7.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.8",
  "pytest-cov>=5",
  "factory-boy>=3.3",
  "freezegun>=1.4",
  "ruff>=0.4",
  "mypy>=1.10",
  "django-stubs>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
# Allow running with zero tests collected (initial scaffold state)
# pytest exit code 5 = no tests collected — acceptable for F1

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["rest_framework.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
